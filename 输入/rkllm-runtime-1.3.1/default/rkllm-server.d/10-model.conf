# /etc/default/rkllm-server.d/10-model.conf - 模型/运行时参数的部署级 drop-in
#
# 优先级（P1-C1 明确）：内置默认 < /etc/rkllm/rkllm.toml < 本目录 *.conf
# < /etc/default/rkllm-server 环境变量 < 命令行。
#
# 本文件**不再写入任何生效赋值**。原实现把 47 个键（含
# RKLLM_MODEL_SEARCH_DIRS= / RKLLM_MODEL_LORA_PATHS= / RKLLM_LOGGING_FILE= /
# RKLLM_OPENAI_JSON_HINT= 等空串）全部激活，导致运维在 TOML 里的配置被静默
# 清空/覆盖（2026-11-20 审核 P1-C1）。
#
# 规则：
#   - 本目录里的**空值**视为"未配置"（不会清空 TOML 的 str/list 键）；
#   - 只有**非空值**才会覆盖 TOML —— 请只在确实需要盖过 TOML 的部署级参数上
#     取消注释并填值；
#   - 一般配置请写 /etc/rkllm/rkllm.toml（`rkllm config init --board` 生成模板，
#     `rkllm config show` 查看生效值与来源）。
#
# 下面保留原本由本文件承载的键作为注释示例（全部等于内置默认值）：

# -- 模型 / model ----------------------------------------------------------
#RKLLM_MODEL_SEARCH_DIRS=/var/lib/rkllm/models
#RKLLM_MODEL_FREQ_HELPER=auto
#RKLLM_MODEL_CLASS=auto
#RKLLM_MODEL_LORA_PATHS=
#RKLLM_MODEL_CONTEXT=4096
#RKLLM_MODEL_MIN_CONTEXT=1024
#RKLLM_MODEL_THREADS=4
#RKLLM_MODEL_PLATFORM=auto
#RKLLM_MODEL_FREQ_LOCK=true
#RKLLM_MODEL_KEEP_HISTORY=false

# -- 引擎 / engine ---------------------------------------------------------
#RKLLM_ENGINE_MODE=subprocess
#RKLLM_ENGINE_LOAD_TIMEOUT_S=300
#RKLLM_ENGINE_RESTART_BACKOFF_S=5
#RKLLM_ENGINE_RESTART_BACKOFF_MAX_S=120
#RKLLM_ENGINE_RESTART_MAX_PER_HOUR=3
#RKLLM_ENGINE_MEMORY_CHECK=true
#RKLLM_ENGINE_MEMORY_RESERVE_MB=1024
#RKLLM_ENGINE_HEALTH_INTERVAL_S=10
#RKLLM_ENGINE_HEARTBEAT_INTERVAL_S=5
#RKLLM_ENGINE_HEARTBEAT_TIMEOUT_S=20

# -- 队列 / queue ----------------------------------------------------------
#RKLLM_QUEUE_MAX_WAIT=32
#RKLLM_QUEUE_WAIT_TIMEOUT_S=600
#RKLLM_QUEUE_REQUEST_TIMEOUT_S=900
#RKLLM_QUEUE_BUSY_RETRY_AFTER_S=5
#RKLLM_QUEUE_MAX_CONCURRENT=1

# -- OpenAI 行为 / openai --------------------------------------------------
#RKLLM_OPENAI_PARAM_POLICY=warn
#RKLLM_OPENAI_TOOLS_MODE=prompt
#RKLLM_OPENAI_TOOL_PARSER=auto
#RKLLM_OPENAI_JSON_SCHEMA_RETRIES=2
#RKLLM_OPENAI_REASONING_FIELD=reasoning_content
#RKLLM_OPENAI_STREAM_HEARTBEAT_S=15
#RKLLM_OPENAI_MAX_TOOL_CALLS=8
#RKLLM_OPENAI_INCLUDE_USAGE_DEFAULT=false
#RKLLM_OPENAI_JSON_HINT=

# -- 缓存 / cache ----------------------------------------------------------
#RKLLM_CACHE_ENABLED=false
#RKLLM_CACHE_DIR=/dev/shm/rkllm/prefix
#RKLLM_CACHE_TTL_S=604800
#RKLLM_CACHE_SIMILARITY=0.5

# -- 日志与指标 / logging & metrics ---------------------------------------
#RKLLM_LOGGING_LEVEL=info
#RKLLM_LOGGING_FORMAT=text
#RKLLM_LOGGING_FILE=
#RKLLM_LOGGING_MAX_BYTES=10485760
#RKLLM_LOGGING_BACKUP_COUNT=5
#RKLLM_METRICS_ENABLED=true
#RKLLM_METRICS_PATH=/metrics
