# ════════════════════════════════════════════════════════════════════
# 本地模型目标配置示例（全键参考版）
# 复制本文件为 targets.conf，去掉所需行前的 # 即可
# ════════════════════════════════════════════════════════════════════
# 配置查找顺序：环境变量 RKLLM_CONFIG → 本目录 targets.conf → 本目录 targets.json（旧格式）
#
# ── 目标行格式 ──────────────────────────────────────────────────────
#   [名称 =] 地址[@密钥] [备注…] [model=模型名] [preset=档位] [其它 键=值]
#
#   · 密钥用 `@` 直接绑在地址上（推荐写法，无歧义）：192.0.2.10:8080@TOKEN
#     无密钥直接写地址；`地址@` 表示显式空密钥
#   · 兼容旧式：地址后跟独立密钥列（第 2 列裸词）
#   · 名称省略 → 用地址当名称
#   · 整行以 # 或 ; 开头是注释；行内 " #" 或 " ;" 之后也是注释
#   · 地址可带 http:// 或 https:// 前缀。⚠️ 仅 HTTPS 的地址（内网穿透、反代等）
#     必须显式写 https://，不写前缀按 http 处理——协议错了会报 RemoteDisconnected
#   · 一行一个目标，不支持续行符，长配置写在同一行
#
# ── 默认目标 ────────────────────────────────────────────────────────
#   default = 目标名（中文别名「默认」同义）。不写则取配置里的第一个目标。
#   ⚠️ 目标名必须与某行目标的名字**完全一致**——写错不会在解析时报错，
#      只会在调用时得到「未知目标」。
#
# default = board
#
# ── 档位 preset：一行切一组阈值 ────────────────────────────────────
#   值：default / 1b / 3b / 4b / 7b / 14b / 32b / auto
#
#   default   RK3588 + Qwen3.5-4B 实测特化档（不写 preset 就是它）
#   1b…32b    尺寸档：跨平台保守估算（吞吐故意取小、只用于放宽超时；32B 为实用上限）
#   auto      从 model= 里的参数量自动选最接近的尺寸档（认不出回落 default）
#
#   档位别名：rk3588 / 板端 / 默认 → default；1.5b / 2b → 1b；3.8b → 3b；
#             5b / 6b → 4b；8b / 9b / generic / 通用 → 7b；13b / 20b → 14b；
#             27b / 30b → 32b；自动 → auto
#
#   各档生效值（行内 键=值 可逐项覆盖）：
#   档位      输入    输出   上下文  吞吐  超时下限  重试  重试等待  截断余量  退化自检
#   default   2600    768    4096   6.3     60      2      8       1.56      开
#   1b        3000    512    4096     8     60      2      5       1.3       关
#   3b        5500   1024    8192     5    120      2      5       1.3       关
#   4b        6000   1024    8192     4    120      2      5       1.3       关
#   7b        6000   1536    8192     3    180      2      5       1.25      关
#   14b      12000   2048   16384     2    240      2      5       1.25      关
#   32b      24000   3072   32768     1    300      1      5       1.2       关
#   （列名 → 键：输入 max_in / 输出 max_out / 上下文 context / 吞吐 tok_per_sec /
#     超时下限 timeout_floor / 重试 retries / 重试等待 retry_wait /
#     截断余量 overrun / 退化自检 degen_check）
#
#   ⚠️ 尺寸档的吞吐取的是**不会误杀的下界**（弱 NPU 上 1B 也可能只有 5 tok/s）：
#     它只用于放宽超时，实机更快不会变慢。换机器后先跑一次实机校准：
#        python rkllm_client.py calibrate [--target 名称]
#     它会真实跑一次生成、量出吞吐，并打印建议的 tok_per_sec / timeout_floor。
#
# ── 可配置键全表（写在目标行内，`键=值`；括号内为等价中文别名）─────
#   model（模型）
#       模型名；仅用于显示与请求体，实际以服务端 /health 返回为准
#   preset（档位 / 模式 / 通用选项）
#       见上表；写 auto 时依赖 model 里的参数量
#   key（key / token / apikey / api_key / 密钥）
#       令牌；与 `地址@密钥` 原子写法等价，二选一。只能 ASCII（HTTP 头限制），
#       含非 ASCII 会被忽略并告警
#   max_in（输入上限）
#       输入预算 token；超出会被拒绝并要求分段送入
#   max_out（输出上限）
#       输出封顶 token；服务端不遵守 max_tokens 时客户端按 overrun 硬截断
#   context（上下文）
#       上下文硬上限 token
#   tok_per_sec（tps / 吞吐）
#       单流吞吐；用于推算超时上限（超时 = 输出/吞吐，但不低于 timeout_floor）
#   timeout_floor（timeout / 超时）
#       超时下限秒
#   retries（重试）
#       失败重试次数；0 = 不重试
#   retry_wait
#       重试前等待秒；0 = 不等待
#   chars_per_token（cpt）
#       1 token ≈ 字符数；默认 0 = 按 CJK 占比自动（中文 1.6 / 拉丁 3.5）。
#       固定 1.6 会把英文高估约 2.5 倍，长英文段落会被误判超预算。
#   prefill_tps
#       输入阶段吞吐；默认 0 = tok_per_sec × 8。长输入的超时要靠它，弱板子上
#       prefill 可能比生成还慢。
#   base_path
#       路径前缀（网关 / 内网穿透常用）：https://x/rkllm 就填 /rkllm。
#   auth_header / auth_prefix
#       认证头与值前缀。默认 Authorization / "Bearer "；Azure 用 api-key / 空，
#       Anthropic 兼容网关用 x-api-key / 空。
#   overrun
#       硬截断余量（× max_out）：服务端实际输出超出 max_tokens 的比例余量
#   degen_check（degen / 退化自检）
#       on / true / yes / 1 / 是 / 开，或 off / false / no / 0 / 否 / 关；
#       检测重复词流等退化特征
#   health（健康检查）
#       rkllm（默认，解析 /health）| none（不探测）|
#       openai（归一为 /v1/models）| 其它值当作 HTTP 路径，2xx 即视为可用
#   ability（能力 / 能力说明）
#       ⚠️ 推荐写在 **[ability] 段**（见文末示例）：段内一行 `目标名 = 描述`，
#       覆盖档位默认描述，段位置无关。行内 `能力=` 旧式仍兼容（其后所有文字都算），
#       原样出现在 local_llm_targets 里，用于提示调用方该目标的用途边界
#
#   数值校验：max_in / max_out / context / timeout_floor / retries / retry_wait
#   取正整数（retries、retry_wait 允许 0）；tok_per_sec / chars_per_token /
#   overrun 取正数；写非法值会在 stderr 告警并回落默认值。
#
# ── 环境变量 ────────────────────────────────────────────────────────
#   RKLLM_CONFIG        指定配置文件路径（优先于默认查找）
#   RKLLM_HOST          单目标快捷方式：板端地址（无前缀按 http）
#   RKLLM_API_KEY       单目标快捷方式：令牌
#   RKLLM_MODEL         单目标快捷方式：模型名
#   RKLLM_PRESET        单目标快捷方式：档位
#   RKLLM_BOARD_SCRIPT  主项目工具链脚本路径（复用其 Board 类；不设用内置客户端）
#
# ════════════════════ 场景示例（去掉行首 # 即生效）══════════════════

# ① 最小写法：只写地址（无令牌、默认档；名称省略 → 用地址当名称）
# 192.0.2.10:8080

# ② 地址 + 令牌（@ 绑定，无歧义），起个名便于 target 参数切换
# board = 192.0.2.10:8080@TOKEN

# ③ 内网穿透 / 仅 HTTPS 的地址：必须带 https:// 前缀
# tunnel = https://xxxxx.goho.co@TOKEN preset=4b

# ④ 按尺寸选档：7B 模型
# box-7b = 192.0.2.50:8080@TOKEN preset=7b model=qwen2.5-7b-instruct

# ⑤ 自动定档：从模型名里认参数量（qwen2.5-14b → 14b 档）
# box-auto = 192.0.2.60:8080@TOKEN preset=auto model=qwen2.5-14b-instruct

# ⑥ 档位 + 单项覆盖（例如压缩输出长度、放宽重试）
# box-14b = 192.0.2.60:8080@TOKEN preset=14b max_out=1024 retries=3

# ⑦ 非 rkllm 服务端（vLLM / ollama 等 OpenAI 兼容服务）：健康检查换 /v1/models
# box-vllm = 192.0.2.70:8000@TOKEN preset=14b health=openai

# ⑧ 全键值微调示例（对照上面键全表逐项覆盖；必须写在同一行）
# tuned = 192.0.2.10:8080@TOKEN model=qwen2.5-3b-instruct preset=3b max_in=4000 max_out=800 context=6144 tps=12 timeout=90 retries=1 retry_wait=3 cpt=1.5 overrun=1.4 degen=on health=rkllm

# ⑨ 不重试的最简档（本机直连、链路稳定时）
# local = localhost:8080 retries=0 retry_wait=0 degen=off

# ── [ability] 段：给调用方模型看的能力边界（推荐写法）──────────────
#   段内一行 `目标名 = 描述`，覆盖档位默认描述；段写在文件任何位置都生效。
#   描述里避免使用 ` #`（会被当作行内注释截断）。
#
# [ability]
# board = 板端 4B（实测档）：短文本改写 / 摘要 / 分类 / 信息抽取；输出上限 768 token。
# box-vllm = 14B 档（GPU）：代码生成与审校 / 较长摘要 / 多步问答；输出上限 2048 token。
#
# 注意：密钥只能用 ASCII 字符（HTTP 请求头限制），填中文会被忽略并告警。
