name: ci

# 服务器的回归门禁：不依赖板端/NPU（测试用 FakeEngine 与桩 supervisor），
# 因此可以在 GitHub 的普通 runner 上跑。打包校验（make_deb/verify_deb）需要
# 上游 tarball 与 dpkg，属发布流程，不在这里做。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic psutil jsonschema \
                      prometheus-client httpx pytest

      - name: Server test suite
        working-directory: 输入/rkllm-runtime-1.3.1
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q

      - name: Test-toolchain suite
        working-directory: 工具/大模型测试工具链
        run: python -m pytest tests -q
